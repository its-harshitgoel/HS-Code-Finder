<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HSCodeFinder — Intelligent HS Code Classification Assistant. Find the correct Harmonized System code for your products with AI-powered conversational guidance.">
    <title>HSCodeFinder — HS Code Classification Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Background Gradient Orbs -->
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>

        <!-- Header -->
        <header id="app-header" class="header">
            <div class="header-content">
                <div class="logo-group">
                    <div>
                        <h1 class="logo-title">HSCodeFinder</h1>
                        <p class="logo-subtitle">AI Classification Assistant</p>
                    </div>
                </div>
                <button id="new-chat-btn" class="btn-new-chat" title="Start new conversation">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Chat
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <main id="chat-area" class="chat-area">
            <!-- Welcome Message (shown initially) -->
            <div id="welcome-screen" class="welcome-screen">
                <h2 class="welcome-title">What product would you like to classify?</h2>
                <p class="welcome-subtitle">Describe your product in plain language and I'll help you find the correct HS code.</p>
            </div>

            <!-- Messages Container -->
            <div id="messages-container" class="messages-container"></div>

            <!-- Typing Indicator -->
            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="typing-avatar">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                </div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer id="input-area" class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="message-input"
                    class="message-input"
                    placeholder="Describe your product..."
                    rows="1"
                    autofocus
                ></textarea>
                <button id="send-btn" class="btn-send" title="Send message" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <p class="input-hint">Press Enter to send, Shift+Enter for new line</p>
        </footer>
    </div>

    <script src="./app.js"></script>
</body>
</html>
